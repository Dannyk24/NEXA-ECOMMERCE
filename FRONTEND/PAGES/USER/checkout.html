<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA | CHECKOUT</title>
    <link rel="shortcut icon" href="../../ASSETS/IMAGES/favicon-white.svg" type="image/x-icon">
    <link rel="stylesheet" href="../../CSS/GLOBAL/style.css">
    <link rel="stylesheet" href="../../CSS/GLOBAL/header.css">
    <link rel="stylesheet" href="../../CSS/GLOBAL/authenticated_header.css">
    <link rel="stylesheet" href="../../CSS/GLOBAL/toasts.css">
    <link rel="stylesheet" href="../../ASSETS/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../CSS/CUSTOM/USER/checkout.css">
</head>

<body>
    <header>
        <div class="overlay"></div>
        <div class="menu-toggle-mobile"><i class="fas fa-bars"></i></div>
        <div class="top-light"></div>
        <div class="header-left">
            <div class="logo"><a href="../../PAGES/USER/homepage.html"><img src="../../ASSETS/IMAGES/nexa-logo.svg"
                        alt=""></a>
            </div>
        </div>
        <div class="header-right">
            <div class="search-bar-container">
                <a class="search-icon-container" href="#">
                    <i class="fas fa-search"></i>
                </a>
                <input type="search" placeholder="Search products...." id="header-search-bar">
            </div>
            <a class="header-icon" href="../../PAGES/USER/wishlist.html" title="Wishlist">
                <i class="fas fa-shopping-bag"></i>
            </a>
            <a class="header-icon" href="../../PAGES/USER/cart.html" title="My Cart">
                <i class="fas fa-shopping-cart"></i>
                <div class="number-badge-display">0</div>
            </a>
            <a class="header-icon" href="../../PAGES/USER/profile.html" title="Profile">
                <i class="fas fa-user"></i>
            </a>
        </div>
        <div class="authenticated-mobile-nav">
            <div class="top">
                <a class="authenticated-nav-item" href="../USER/homepage.html">
                    <i class="fas fa-house"></i>
                    <span>Home</span>
                </a>
                <a class="authenticated-nav-item" href="../USER/wishlist.html">
                    <i class="fas fa-heart"></i>
                    <span>Wishlist</span>
                </a>
                <a class="authenticated-nav-item" href="../USER/cart.html">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Cart</span>
                </a>
                <a class="authenticated-nav-item" href="../USER/profile.html">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
            </div>
            <div class="bottom">
                <button class="log-out-button">Log out</button>
            </div>
        </div>
    </header>
    <div class="wrapper">
        <main>
            <div class="checkout-left">
                <div class="checkout-progress-container">
                    <div class="checkout-progress-stage active-checkout-progress-stage">
                        <div class="number-container">
                            1
                        </div>
                        <span>shipping</span>
                    </div>
                    <div class="line"></div>
                    <div class="checkout-progress-stage">
                        <div class="number-container">
                            2
                        </div>
                        <span>payment</span>
                    </div>
                    <div class="line"></div>
                    <div class="checkout-progress-stage">
                        <div class="number-container">
                            3
                        </div>
                        <span>review</span>
                    </div>
                </div>
                <form class="checkout-form active-checkout-form" id="shipping-address-form">
                    <div class="form-title">shipping address</div>
                    <div class="form-sub-title">Please enter the delivery address for your order</div>
                    <div class="checkout-form-inputs-container">
                        <div class="checkout-form-input-field-group">
                            <label for="full-name">full name</label>
                            <input type="text" placeholder="Jonathan Doe" required>
                        </div>
                        <div class="checkout-form-input-field-group">
                            <label for="street-address">street address</label>
                            <input type="text" placeholder="123 gallery Street, Apt 48" required>
                        </div>
                        <div class="double-input-field-group-container">
                            <div class="checkout-form-input-field-group">
                                <label for="city">city</label>
                                <input type="text" placeholder="Metropolis" required>
                            </div>
                            <div class="checkout-form-input-field-group">
                                <label for="postal-code">Zip/Postal Code</label>
                                <input type="text" placeholder="e.g 10101" required>
                            </div>
                        </div>
                        <div class="checkout-form-input-field-group">
                            <label for="country">country</label>
                            <select name="country" id="country-input">
                                <option value="united-states">United States</option>
                                <option value="nigeria" selected>Nigeria</option>
                                <option value="south-africa">South Africa</option>
                                <option value="ghana">Ghana</option>
                                <option value="united-kingdom">United Kingdom</option>
                                <option value="canada">Canada</option>
                            </select>
                        </div>
                    </div>
                    <div class="cta primary-cta checkout-form-submit-button">Continue to Payment</div>
                </form>
            </div>
            <div class="checkout-right">
                <p>Order Summary</p>
                <div class="order-summary">
                    <div class="summaries-container">
                        <div class="order-summary-price-field-container">
                            <div class="price-title">subtotal:</div>
                            <div class="price-value">$600.00</div>
                        </div>
                        <div class="order-summary-price-field-container">
                            <div class="price-title">shipping:</div>
                            <div class="price-value">free</div>
                        </div>
                        <div class="order-summary-price-field-container">
                            <div class="price-title">tax:</div>
                            <div class="price-value">$0</div>
                        </div>
                        <div class="order-summary-price-field-container">
                            <div class="price-title">total:</div>
                            <div class="price-value order-total">$600.00</div>
                        </div>
                    </div>
                    <div class="products-list">
                        <p>Products List</p>
                        <div class="order-summary-product-container">
                            <div class="product-image">
                                <img src="../../ASSETS/IMAGES/PRODUCT-IMAGES/earbuds-1.webp" alt="">
                            </div>
                            <div class="product-info">
                                <div class="product-name">Nexa custom earbuds</div>
                                <div class="product-price">$198.00</div>
                            </div>
                        </div>
                        <div class="order-summary-product-container">
                            <div class="product-image">
                                <img src="../../ASSETS/IMAGES/PRODUCT-IMAGES/earbuds-1.webp" alt="">
                            </div>
                            <div class="product-info">
                                <div class="product-name">Nexa custom earbuds</div>
                                <div class="product-price">$198.00</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>












    <!--TOAST-->
    <div class="toast-container">
        <div class="toast-background"></div>
        <div class="toast-icon">
            <i class="fas fa-check"></i>
        </div>
        <div class="toast-data">
            <div class="toast-header"></div>
            <div class="toast-message"></div>
        </div>
    </div>

    <script src="../../SCRIPTS/MODULES/authenticated_header.js" type="module"></script>
    <script src="../../SCRIPTS/USER/checkout.js" type="module"></script>

</body>

</html>
